name: RDP via Pinggy (5 Hour Session)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'RDP Password'
        required: true
        default: 'Prateek@3000!'
      session_minutes:
        description: 'Session duration in minutes (max 355)'
        required: true
        default: '300'

jobs:
  rdp:
    name: Windows RDP via Pinggy Tunnel
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # ---------- Step 1: Enable RDP ----------
      - name: Enable Remote Desktop (RDP)
        shell: powershell
        run: |
          Write-Host "===== Enabling RDP ====="
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          Write-Host "===== Enabling Firewall Rules ====="
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-NetFirewallRule -DisplayGroup "Remote Desktop" -Enabled True -Profile Any

          Write-Host "===== Starting RDP Services ====="
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService
          Set-Service -Name UmRdpService -StartupType Automatic
          Start-Service UmRdpService
          Write-Host "RDP enabled."

      # ---------- Step 2: Configure User & Password ----------
      - name: Configure RDP User & Password
        shell: powershell
        run: |
          Write-Host "===== Disabling password complexity policy ====="
          secedit /export /cfg C:\secpol.cfg | Out-Null
          (Get-Content C:\secpol.cfg) `
            -replace "PasswordComplexity = 1", "PasswordComplexity = 0" `
            -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 0" `
            | Out-File C:\secpol.cfg -Encoding ascii
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
          Remove-Item C:\secpol.cfg -Force -ErrorAction SilentlyContinue

          $pass = ConvertTo-SecureString -AsPlainText "${{ github.event.inputs.rdp_password }}" -Force

          Write-Host "===== Setting password ====="
          Set-LocalUser -Name "runneradmin" -Password $pass
          Write-Host "Password set."

          Write-Host "===== Adding to Administrators ====="
          try { Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction Stop; Write-Host "OK" }
          catch { Write-Host "Skipped: $($_.Exception.Message)" }

          Write-Host "===== Adding to Remote Desktop Users ====="
          try { Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction Stop; Write-Host "OK" }
          catch { Write-Host "Skipped: $($_.Exception.Message)" }

          Write-Host "Username : runneradmin"
          Write-Host "Password : ${{ github.event.inputs.rdp_password }}"

      # ---------- Step 3: Start Pinggy Tunnel ----------
      - name: Start Pinggy Tunnel for RDP
        shell: powershell
        run: |
          Write-Host "===== Starting Pinggy tunnel for port 3389 ====="

          $logFile = "$env:TEMP\pinggy.log"
          $errFile = "$env:TEMP\pinggy.err.log"

          Remove-Item $logFile -Force -ErrorAction SilentlyContinue
          Remove-Item $errFile -Force -ErrorAction SilentlyContinue

          # -T flag zaroori hai: pseudo-terminal allocation disable karta hai
          $sshArgs = @(
            '-p','443',
            '-T',
            '-o','StrictHostKeyChecking=no',
            '-o','UserKnownHostsFile=NUL',
            '-o','ServerAliveInterval=30',
            '-o','ServerAliveCountMax=3',
            '-R0:127.0.0.1:3389',
            'tcp@free.pinggy.io'
          )

          Start-Process -FilePath "ssh" -ArgumentList $sshArgs `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError $errFile `
            -WindowStyle Hidden

          Write-Host "Waiting 25 seconds for Pinggy to assign public address..."
          Start-Sleep -Seconds 25

          Write-Host "===== Pinggy Output ====="
          Get-Content $logFile -ErrorAction SilentlyContinue | Write-Host
          Get-Content $errFile -ErrorAction SilentlyContinue | Write-Host

          $content = (Get-Content $logFile -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $errFile -Raw -ErrorAction SilentlyContinue)

          if ($content -match "tcp://([a-zA-Z0-9\.\-]+):(\d+)") {
            $h = $matches[1]
            $p = $matches[2]
            Write-Host ""
            Write-Host "=================================================="
            Write-Host "   RDP ADDRESS : $h`:$p"
            Write-Host "   USERNAME    : runneradmin"
            Write-Host "   PASSWORD    : ${{ github.event.inputs.rdp_password }}"
            Write-Host "=================================================="
            Write-Host ""
            echo "RDP_HOST=$h`:$p" >> $env:GITHUB_ENV
          } else {
            Write-Host "[ERROR] Pinggy address not found in log."
            Write-Host "Full log:"
            Get-Content $logFile
            Get-Content $errFile
            exit 1
          }

      # ---------- Step 4: Show Connection Summary ----------
      - name: Show Connection Details (Summary)
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "##################################################"
          Write-Host "#        RDP SESSION READY (5 HOURS)             #"
          Write-Host "##################################################"
          Write-Host "#  HOST     : $env:RDP_HOST"
          Write-Host "#  USERNAME : runneradmin"
          Write-Host "#  PASSWORD : ${{ github.event.inputs.rdp_password }}"
          Write-Host "#  DURATION : ${{ github.event.inputs.session_minutes }} minutes"
          Write-Host "##################################################"
          Write-Host ""
          Write-Host "mstsc kholo, Computer field me daalo: $env:RDP_HOST"
          Write-Host ""

          echo "### RDP Session Details" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          echo "| **Host** | \`$env:RDP_HOST\` |" >> $env:GITHUB_STEP_SUMMARY
          echo "| **Username** | \`runneradmin\` |" >> $env:GITHUB_STEP_SUMMARY
          echo "| **Password** | \`${{ github.event.inputs.rdp_password }}\` |" >> $env:GITHUB_STEP_SUMMARY
          echo "| **Duration** | ${{ github.event.inputs.session_minutes }} minutes |" >> $env:GITHUB_STEP_SUMMARY

      # ---------- Step 5: Keep Session Alive ----------
      - name: Keep RDP Session Alive
        shell: powershell
        run: |
          $mins = [int]"${{ github.event.inputs.session_minutes }}"
          $seconds = $mins * 60
          Write-Host "===== Session will stay alive for $mins minutes ====="
          Write-Host "Start time: $(Get-Date)"
          Write-Host "RDP HOST   : $env:RDP_HOST"

          $elapsed = 0
          while ($elapsed -lt $seconds) {
            Start-Sleep -Seconds 60
            $elapsed += 60

            $sshAlive = Get-Process -Name "ssh" -ErrorAction SilentlyContinue
            if (-not $sshAlive) {
              Write-Host "[WARN] SSH tunnel died! Restarting Pinggy..."

              $logFile = "$env:TEMP\pinggy.log"
              $errFile = "$env:TEMP\pinggy.err.log"
              Remove-Item $logFile -Force -ErrorAction SilentlyContinue
              Remove-Item $errFile -Force -ErrorAction SilentlyContinue

              $sshArgs = @(
                '-p','443',
                '-T',
                '-o','StrictHostKeyChecking=no',
                '-o','UserKnownHostsFile=NUL',
                '-o','ServerAliveInterval=30',
                '-o','ServerAliveCountMax=3',
                '-R0:127.0.0.1:3389',
                'tcp@free.pinggy.io'
              )
              Start-Process -FilePath "ssh" -ArgumentList $sshArgs `
                -RedirectStandardOutput $logFile `
                -RedirectStandardError $errFile `
                -WindowStyle Hidden

              Start-Sleep -Seconds 20

              $newContent = (Get-Content $logFile -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $errFile -Raw -ErrorAction SilentlyContinue)
              if ($newContent -match "tcp://([a-zA-Z0-9\.\-]+):(\d+)") {
                Write-Host "[INFO] NEW RDP ADDRESS: $($matches[1]):$($matches[2])"
                Write-Host "[INFO] mstsc me ye naya address daalo!"
              }
            }

            $minsLeft = [math]::Floor(($seconds - $elapsed) / 60)
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Alive. Minutes remaining: $minsLeft"
          }

          Write-Host "===== Session time completed ====="

      # ---------- Step 6: Cleanup ----------
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "===== Cleaning up ====="
          Stop-Process -Name "ssh" -Force -ErrorAction SilentlyContinue
          Write-Host "SSH tunnel closed."
